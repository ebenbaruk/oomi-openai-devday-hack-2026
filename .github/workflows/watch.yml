name: Apple Watch app

on:
  push:
    paths: ["apple/**", ".github/workflows/watch.yml"]
  pull_request:
    paths: ["apple/**", ".github/workflows/watch.yml"]
  workflow_dispatch:

concurrency:
  group: watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test OomiWatch (watchOS simulator)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a watch simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -E "Apple Watch (Series|Ultra)" | head -1 | sed -E 's/^ *(.*) \([0-9A-F-]+\) \(.*$/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"
      - name: Build
        run: |
          xcodebuild -project OomiWatch.xcodeproj -scheme OomiWatch \
            -destination "platform=watchOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO build | xcpretty || exit ${PIPESTATUS[0]}
      - name: Test
        run: |
          xcodebuild -project OomiWatch.xcodeproj -scheme OomiWatch \
            -destination "platform=watchOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO test | xcpretty || exit ${PIPESTATUS[0]}
