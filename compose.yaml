services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: oomi
      POSTGRES_USER: oomi
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - oomi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oomi -d oomi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  oomi-postgres:
